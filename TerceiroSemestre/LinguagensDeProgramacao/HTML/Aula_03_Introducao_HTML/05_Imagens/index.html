<!DOCTYPE html>
<!--
Exercicio 05 - Imagens

Crie imagem.html com alguns elementos img, informando src, alt e dimensões para as imagens.

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens</title>
</head>
<body>
    <h1>Imagens de produtos</h1>
    <p>Mouse com fio:</p>
    <img src="imagens/mouse_laser.jpeg" alt="Mouse Dell preto com fio" width="167" height="167">
    <p>Mouse sem fio:</p>
    <img src="imagens/mouse_bluetooth.jpeg" alt="Mouse Dell cinza sem fio" width="167" height="167">
    <p>Mouse óptico:</p>
    <img src="imagens/mouse_optico.jpeg" alt="Mouse óptico preto com fio" width="165" height="165">
</body>
</html>
