<!DOCTYPE html>
<!--
Exercicio 06 - Envio com e sem validação
Origem: Prática complementar dos slides HTML5

Compare um botão normal de envio com um botão de rascunho usando formnovalidate. Nenhum dado
será salvo.
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envio com e sem validação</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="demonstracao.js" defer></script>
</head>
<body>
    <h1>Envio com e sem validação</h1>
<p>Prática local: os dados não são transmitidos nem armazenados.</p>
<form action="#" method="post" data-demonstracao data-status="resultado" >
<label for="nome">Nome *</label>
<input type="text" id="nome" name="nome" required >
<label for="email">Email *</label>
<input type="email" id="email" name="email" required >
<button type="submit">Validar envio</button><button type="submit" formnovalidate>Testar rascunho</button>
</form>
<p id="resultado" class="status" role="status" aria-live="polite"></p>
    <p><a href="README.md">Descrição do conteúdo</a></p>
</body>
</html>
