<!DOCTYPE html>
<!--

Origem: Prática complementar dos slides HTML5

Use mark, time, abbr, strong, em e code em um aviso de aula, mantendo uma hierarquia de títulos.

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcação de texto</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <h1>Marcação de texto</h1>
<article><h2>Próxima atividade</h2><p>A entrega está marcada para <time datetime="2026-10-30T19:00">30/10/2026 às 19h</time>.</p><p><strong>Atenção:</strong> revise os <mark>campos obrigatórios</mark> antes do envio.</p><p>O <abbr title="HyperText Markup Language">HTML</abbr> descreve o conteúdo. Use <code>required</code> quando um campo precisar ser preenchido.</p><p><em>Datas e textos usados apenas como exemplo.</em></p></article>
    <p><a href="README.md">Descrição do conteúdo</a></p>
</body>
</html>
