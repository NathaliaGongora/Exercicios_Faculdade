<!DOCTYPE html>
<!--
Exercicio 07 - Detalhes e indicadores
Origem: Prática complementar dos slides HTML5

Use details, summary, progress e meter para mostrar informações de uma atividade. Os valores são
exemplos estáticos.
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes e indicadores</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <h1>Detalhes e indicadores</h1>
<details><summary>Dados da atividade</summary><p>Conteúdo: HTML5.</p><p>Exercícios concluídos: 6 de 10.</p></details><p><label for="progresso">Progresso de conclusão:</label><progress id="progresso" value="6" max="10">60%</progress></p><p><label for="ocupacao">Ocupação de uma turma:</label><meter id="ocupacao" min="0" max="20" value="12">12 de 20 vagas</meter></p>
    <p><a href="README.md">Descrição do conteúdo</a></p>
</body>
</html>
