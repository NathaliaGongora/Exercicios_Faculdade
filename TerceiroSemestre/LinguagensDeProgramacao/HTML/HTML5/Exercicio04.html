<!DOCTYPE html>
<!--
Exercicio 04 - Tipos de campos HTML5
Origem: Prática complementar dos slides HTML5

Crie um formulário de demonstração com email, url, tel, search, date, month, week, time,
datetime-local, number, range e color.
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de campos HTML5</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="demonstracao.js" defer></script>
</head>
<body>
    <h1>Tipos de campos HTML5</h1>
<p>Prática local: os dados não são transmitidos nem armazenados.</p>
<form action="#" method="post" data-demonstracao data-status="resultado" >
<label for="email">Email</label>
<input type="email" id="email" name="email" >
<label for="site">Site</label>
<input type="url" id="site" name="site" placeholder="https://exemplo.com">
<label for="telefone">Telefone</label>
<input type="tel" id="telefone" name="telefone" >
<label for="busca">Pesquisa</label>
<input type="search" id="busca" name="busca" >
<label for="data">Data</label>
<input type="date" id="data" name="data" >
<label for="mes">Mês</label>
<input type="month" id="mes" name="mes" >
<label for="semana">Semana</label>
<input type="week" id="semana" name="semana" >
<label for="hora">Horário</label>
<input type="time" id="hora" name="hora" >
<label for="agendamento">Data e hora local</label>
<input type="datetime-local" id="agendamento" name="agendamento" >
<label for="quantidade">Quantidade</label>
<input type="number" id="quantidade" name="quantidade" min="1" max="10" step="1">
<label for="nivel">Nível de interesse</label>
<input type="range" id="nivel" name="nivel" min="0" max="10" value="5">
<label for="cor">Cor preferida</label>
<input type="color" id="cor" name="cor" value="#336699">
<button type="submit">Conferir</button>
</form>
<p id="resultado" class="status" role="status" aria-live="polite"></p>
    <p><a href="README.md">Descrição do conteúdo</a></p>
</body>
</html>
