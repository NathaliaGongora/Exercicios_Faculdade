<!DOCTYPE html>
<!--
Exercicio 08 - Agendamento
Origem: Complementar dos slides de formulários

Use date, time e datetime-local para praticar data, horário e data/hora local.
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="demonstracao.js" defer></script>
</head>
<body>
    <h1>Agendamento</h1>
<p>Prática local: os dados não são transmitidos nem armazenados.</p>
<form action="#" method="post" data-demonstracao data-status="resultado" >
<label for="data">Data da visita *</label>
<input type="date" id="data" name="data" required >
<label for="hora">Hora da visita *</label>
<input type="time" id="hora" name="hora" required >
<label for="inicio">Início de outra atividade</label>
<input type="datetime-local" id="inicio" name="inicio" >
<button type="submit">Conferir</button>
</form>
<p id="resultado" class="status" role="status" aria-live="polite"></p>
    <p><a href="README.md">Descrição do conteúdo</a></p>
</body>
</html>
