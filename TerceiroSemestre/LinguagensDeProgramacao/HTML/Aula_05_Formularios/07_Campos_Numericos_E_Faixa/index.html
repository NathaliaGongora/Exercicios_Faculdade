<!DOCTYPE html>
<!--
Exercicio 07 - Campos numéricos e faixa
Origem: Complementar dos slides de formulários

Crie campos de quantidade e parcelas com min, max e step e uma barra range para interesse de 0 a
10.
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campos numéricos e faixa</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="demonstracao.js" defer></script>
</head>
<body>
    <h1>Campos numéricos e faixa</h1>
<p>Prática local: os dados não são transmitidos nem armazenados.</p>
<form action="#" method="post" data-demonstracao data-status="resultado" >
<label for="quantidade">Quantidade de materiais *</label>
<input type="number" id="quantidade" name="quantidade" required min="1" max="20" step="1">
<label for="parcelas">Parcelas *</label>
<input type="number" id="parcelas" name="parcelas" required min="1" max="6" step="1">
<label for="interesse">Interesse: faixa de 0 a 10</label>
<input type="range" id="interesse" name="interesse" min="0" max="10" value="5">
<button type="submit">Conferir</button>
</form>
<p id="resultado" class="status" role="status" aria-live="polite"></p>
    <p><a href="README.md">Descrição do conteúdo</a></p>
</body>
</html>
