<!--
Exercício 01 — Cursos e Inscrição (lista da aula).
Criar um catálogo com nome, descrição, turno, horário, professores e valor.
Cada link de inscrição deve transmitir o código do curso pela URL.
No formulário, cadastrar aluno (nome, endereço, bairro, cidade, número, CEP,
complemento, estado, telefone, celular, e-mail e cor), pai e mãe (nome,
nascimento, naturalidade, instrução, profissão, celular, e-mail, CPF e
responsabilidade financeira), e curso (nome, ingresso, valor e parcelas).
Exigir nome, celular, e-mail e cor do aluno; nome, celular, e-mail e CPF de
cada responsável; nome, ingresso, valor e parcelas do curso.
Salvar a inscrição no MockAPI somente com os campos obrigatórios preenchidos.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição nos cursos</title>
</head>
<body>

    <h1>Formulário de inscrição</h1>
    <p>Os campos marcados com * são obrigatórios.</p>

    <!-- O JavaScript envia os dados em JSON para este recurso. -->
    <form id="inscricao" action="https://6a99f5bf9a7ec1b817d20090.mockapi.io/inscricoes" method="post">

        <input type="hidden" id="codigoCurso" name="codigoCurso">

        <!-- DADOS DO ALUNO -->
        <fieldset>
            <legend>Dados do aluno</legend>

            <p>
                <label for="nomeAluno">Nome *</label>
                <input type="text" id="nomeAluno"
                       name="nomeAluno" required>
            </p>

            <p>
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" name="endereco">
            </p>

            <p>
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" name="bairro">
            </p>

            <p>
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" name="cidade">
            </p>

            <p>
                <label for="numero">Número</label>
                <input type="text" id="numero" name="numero">
            </p>

            <p>
                <label for="cep">CEP</label>
                <input type="text" id="cep" name="cep"
                       placeholder="00000-000">
            </p>

            <p>
                <label for="complemento">Complemento</label>
                <input type="text" id="complemento" name="complemento">
            </p>

            <p>
                <label for="estado">Estado</label>
                <select id="estado" name="estado">
                    <option value="">Selecione</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>
            </p>

            <p>
                <label for="telefoneAluno">Telefone</label>
                <input type="tel" id="telefoneAluno"
                       name="telefoneAluno"
                       placeholder="(15) 3333-3333">
            </p>

            <p>
                <label for="celularAluno">Celular *</label>
                <input type="tel" id="celularAluno"
                       name="celularAluno"
                       placeholder="(15) 99999-9999" required>
            </p>

            <p>
                <label for="emailAluno">E-mail *</label>
                <input type="email" id="emailAluno"
                       name="emailAluno" required>
            </p>

            <p>
                <label for="corAluno">Cor *</label>
                <select id="corAluno" name="corAluno" required>
                    <option value="">Selecione</option>
                    <option value="Branca">Branca</option>
                    <option value="Preta">Preta</option>
                    <option value="Parda">Parda</option>
                    <option value="Amarela">Amarela</option>
                    <option value="Indígena">Indígena</option>
                </select>
            </p>
        </fieldset>

        <!-- DADOS DO PAI -->
        <fieldset>
            <legend>Dados do pai</legend>

            <p>
                <label for="nomePai">Nome *</label>
                <input type="text" id="nomePai"
                       name="nomePai" required>
            </p>

            <p>
                <label for="nascimentoPai">Data de nascimento</label>
                <input type="date" id="nascimentoPai"
                       name="nascimentoPai">
            </p>

            <p>
                <label for="naturalidadePai">Naturalidade</label>
                <input type="text" id="naturalidadePai"
                       name="naturalidadePai">
            </p>

            <p>
                <label for="instrucaoPai">Instrução</label>
                <input type="text" id="instrucaoPai"
                       name="instrucaoPai"
                       placeholder="Ex.: ensino médio completo">
            </p>

            <p>
                <label for="profissaoPai">Profissão</label>
                <input type="text" id="profissaoPai"
                       name="profissaoPai">
            </p>

            <p>
                <label for="celularPai">Celular *</label>
                <input type="tel" id="celularPai"
                       name="celularPai" required>
            </p>

            <p>
                <label for="emailPai">E-mail *</label>
                <input type="email" id="emailPai"
                       name="emailPai" required>
            </p>

            <p>
                <label for="cpfPai">CPF *</label>
                <input type="text" id="cpfPai"
                       name="cpfPai"
                       placeholder="000.000.000-00" required>
            </p>

            <p>É responsável financeiro?</p>

            <p>
                <input type="radio" id="paiSim"
                       name="responsavelFinanceiroPai" value="sim">
                <label for="paiSim">Sim</label>

                <input type="radio" id="paiNao"
                       name="responsavelFinanceiroPai" value="nao">
                <label for="paiNao">Não</label>
            </p>
        </fieldset>

        <!-- DADOS DA MÃE -->
        <fieldset>
            <legend>Dados da mãe</legend>

            <p>
                <label for="nomeMae">Nome *</label>
                <input type="text" id="nomeMae"
                       name="nomeMae" required>
            </p>

            <p>
                <label for="nascimentoMae">Data de nascimento</label>
                <input type="date" id="nascimentoMae"
                       name="nascimentoMae">
            </p>

            <p>
                <label for="naturalidadeMae">Naturalidade</label>
                <input type="text" id="naturalidadeMae"
                       name="naturalidadeMae">
            </p>

            <p>
                <label for="instrucaoMae">Instrução</label>
                <input type="text" id="instrucaoMae"
                       name="instrucaoMae"
                       placeholder="Ex.: ensino médio completo">
            </p>

            <p>
                <label for="profissaoMae">Profissão</label>
                <input type="text" id="profissaoMae"
                       name="profissaoMae">
            </p>

            <p>
                <label for="celularMae">Celular *</label>
                <input type="tel" id="celularMae"
                       name="celularMae" required>
            </p>

            <p>
                <label for="emailMae">E-mail *</label>
                <input type="email" id="emailMae"
                       name="emailMae" required>
            </p>

            <p>
                <label for="cpfMae">CPF *</label>
                <input type="text" id="cpfMae"
                       name="cpfMae"
                       placeholder="000.000.000-00" required>
            </p>

            <p>É responsável financeiro?</p>

            <p>
                <input type="radio" id="maeSim"
                       name="responsavelFinanceiroMae" value="sim">
                <label for="maeSim">Sim</label>

                <input type="radio" id="maeNao"
                       name="responsavelFinanceiroMae" value="nao">
                <label for="maeNao">Não</label>
            </p>
        </fieldset>

        <!-- DADOS DO CURSO -->
        <fieldset>
            <legend>Dados do curso</legend>

            <p>
                <label for="nomeCurso">Nome do curso escolhido *</label>
                <select id="nomeCurso" name="nomeCurso" required>
                    <option value="">Selecione</option>
                    <option value="Desenho e pintura">Desenho e pintura</option>
                    <option value="Música">Música</option>
                    <option value="Teatro">Teatro</option>
                </select>
            </p>

            <p>
                <label for="dataIngresso">Data de ingresso *</label>
                <input type="date" id="dataIngresso"
                       name="dataIngresso" required>
            </p>

            <p>
                <label for="valorCurso">Valor do curso em reais *</label>
                <input type="number" id="valorCurso"
                       name="valorCurso" readonly
                       min="0" step="0.01" required>
            </p>

            <p>
                <label for="parcelas">
                    Forma de pagamento — quantidade de parcelas *
                </label>
                <input type="number" id="parcelas"
                       name="parcelas"
                       min="1" step="1" required>
            </p>
        </fieldset>

        <p>
            <button type="submit" id="salvar">Salvar inscrição</button>
            <button type="reset">Limpar formulário</button>
        </p>

    </form>
    <p id="mensagem" role="status"></p>

    <p>
        <a href="index.html">Voltar para os cursos</a>
    </p>

    <script src="inscricao.js"></script>
</body>
</html>
