<!DOCTYPE html>
<!--
Exercicio 06 - Menu de cursos
Origem: Complementar dos slides de formulários

Use select e option para escolher um curso obrigatório e um nível opcional.
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu de cursos</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="demonstracao.js" defer></script>
</head>
<body>
    <h1>Menu de cursos</h1>
<p>Prática local: os dados não são transmitidos nem armazenados.</p>
<form action="#" method="post" data-demonstracao data-status="resultado" >
<label for="curso">Curso *</label>
<select id="curso" name="curso" required ><option value="">Selecione</option><option value="1">Desenho</option><option value="2">Música</option><option value="3">Teatro</option></select>
<label for="nivel">Nível</label>
<select id="nivel" name="nivel" ><option value="">Selecione</option><option value="iniciante">Iniciante</option><option value="intermediario">Intermediário</option></select>
<button type="submit">Conferir</button>
</form>
<p id="resultado" class="status" role="status" aria-live="polite"></p>
    <p><a href="README.md">Descrição do conteúdo</a></p>
</body>
</html>
