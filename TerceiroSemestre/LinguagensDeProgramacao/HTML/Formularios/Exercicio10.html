<!DOCTYPE html>
<!--
Exercicio 10 - Botões e campos desabilitados
Origem: Complementar dos slides de formulários

Crie botões de envio, reset e envio sem validação. Inclua um código readonly e uma informação
disabled para comparar a participação no envio.
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botões e campos desabilitados</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="demonstracao.js" defer></script>
</head>
<body>
    <h1>Botões e campos desabilitados</h1>
<p>Prática local: os dados não são transmitidos nem armazenados.</p>
<form action="#" method="post" data-demonstracao data-status="resultado" >
<label for="codigo">Código somente leitura</label>
<input type="text" id="codigo" name="codigo" value="CURSO-01" readonly>
<label for="interno">Informação desabilitada</label>
<input type="text" id="interno" name="interno" value="Exemplo" disabled>
<label for="nome">Nome *</label>
<input type="text" id="nome" name="nome" required >
<button type="submit">Validar envio</button><button type="submit" formnovalidate>Ignorar validação neste teste</button><button type="reset">Restaurar</button>
</form>
<p id="resultado" class="status" role="status" aria-live="polite"></p>
    <p><a href="README.md">Descrição do conteúdo</a></p>
</body>
</html>
