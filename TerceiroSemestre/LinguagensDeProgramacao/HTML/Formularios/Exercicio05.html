<!DOCTYPE html>
<!--
Exercicio 05 - Escolha única de turno
Origem: Complementar dos slides de formulários

Use radio buttons com o mesmo name para permitir a escolha de apenas um turno obrigatório.
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha única de turno</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="demonstracao.js" defer></script>
</head>
<body>
    <h1>Escolha única de turno</h1>
<p>Prática local: os dados não são transmitidos nem armazenados.</p>
<form action="#" method="post" data-demonstracao data-status="resultado" >
<fieldset><legend>Turno *</legend><p><input type="radio" id="manha" name="turno" value="manha" required><label class="opcao" for="manha">Manhã</label></p><p><input type="radio" id="tarde" name="turno" value="tarde"><label class="opcao" for="tarde">Tarde</label></p></fieldset><button type="submit">Conferir</button>
</form>
<p id="resultado" class="status" role="status" aria-live="polite"></p>
    <p><a href="README.md">Descrição do conteúdo</a></p>
</body>
</html>
