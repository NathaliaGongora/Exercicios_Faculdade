<!DOCTYPE html>
<!--
Exercicio 04 - Seleção de interesses
Origem: Complementar dos slides de formulários

Crie caixas de seleção independentes para que o usuário possa escolher vários interesses. Agrupe
com fieldset e legend.
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleção de interesses</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="demonstracao.js" defer></script>
</head>
<body>
    <h1>Seleção de interesses</h1>
<p>Prática local: os dados não são transmitidos nem armazenados.</p>
<form action="#" method="post" data-demonstracao data-status="resultado" >
<fieldset><legend>Interesses</legend><p><input type="checkbox" id="musica" name="interesses" value="musica"><label class="opcao" for="musica">Música</label></p><p><input type="checkbox" id="teatro" name="interesses" value="teatro"><label class="opcao" for="teatro">Teatro</label></p><p><input type="checkbox" id="pintura" name="interesses" value="pintura"><label class="opcao" for="pintura">Pintura</label></p></fieldset><button type="submit">Conferir</button>
</form>
<p id="resultado" class="status" role="status" aria-live="polite"></p>
    <p><a href="README.md">Descrição do conteúdo</a></p>
</body>
</html>
