<!DOCTYPE html>
<!--
Exercicio 05 - Validação de campos
Origem: Prática complementar dos slides HTML5

Pratique required, maxlength, pattern e placeholder em um formulário com nome, email e CEP. O
CEP deve aceitar 12345-678 ou 12345678.
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de campos</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="demonstracao.js" defer></script>
</head>
<body>
    <h1>Validação de campos</h1>
<p>Prática local: os dados não são transmitidos nem armazenados.</p>
<form action="#" method="post" data-demonstracao data-status="resultado" >
<label for="nome">Nome *</label>
<input type="text" id="nome" name="nome" required maxlength="60" placeholder="Nome de exemplo">
<label for="email">Email *</label>
<input type="email" id="email" name="email" required >
<label for="cep">CEP *</label>
<input type="text" id="cep" name="cep" required pattern="[0-9]{5}-?[0-9]{3}" placeholder="12345-678" title="Use 12345-678 ou 12345678">
<button type="submit">Validar</button>
</form>
<p id="resultado" class="status" role="status" aria-live="polite"></p>
    <p><a href="README.md">Descrição do conteúdo</a></p>
</body>
</html>
