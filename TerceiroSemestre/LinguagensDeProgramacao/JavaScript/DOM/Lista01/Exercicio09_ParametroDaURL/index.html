<!DOCTYPE html>
<!--
Exercício 09 — Parametro Da URL
Origem: Prática complementar
Leia o parâmetro curso da URL e preencha um input. Trate sua ausência.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parametro Da URL</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<h1>Parâmetro da URL</h1>
<p>
<a href="?curso=HTML">Testar com curso HTML</a>
</p>
<label for="curso">Curso recebido</label>
<input id="curso" readonly>
<p id="mensagem" role="status">
</p>
<script src="script.js">
</script>
</body>
</html>
