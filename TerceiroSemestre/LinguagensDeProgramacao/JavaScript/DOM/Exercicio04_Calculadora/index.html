<!DOCTYPE html>
<!--
Exercício 04 — Calculadora
Origem: Lista do professor
Crie uma página HTML que possui 2 campos e 4 botões (Somar, Subtrair, Dividir e Multiplicar), ao colocar os números e clicar em um dos botões devem realizar a operação escolhida. Valide se os números foram digitados. Ao dividir por zero, mostre o alert “Impossível dividir por zero”.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<h1>Calculadora</h1>
<label for="numero1">Primeiro número</label>
<input type="number" step="any" id="numero1">
<label for="numero2">Segundo número</label>
<input type="number" step="any" id="numero2">
<p>
<button data-operacao="somar">Somar</button> <button data-operacao="subtrair">Subtrair</button> <button data-operacao="dividir">Dividir</button> <button data-operacao="multiplicar">Multiplicar</button>
</p>
<p id="resultado" role="status">
</p>
<script src="script.js">
</script>
</body>
</html>
