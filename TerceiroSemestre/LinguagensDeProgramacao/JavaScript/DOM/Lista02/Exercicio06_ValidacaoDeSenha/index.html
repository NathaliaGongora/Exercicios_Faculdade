<!DOCTYPE html>
<!--
Exercício 06 — Validacao De Senha
Origem: Lista 02 do professor
Enunciado:
Crie um campo de senha (type="password") que, enquanto o usuário digita, mostre uma mensagem abaixo indicando se a senha atende aos requisitos:
Mínimo 8 caracteres
Pelo menos 1 número
A mensagem deve ficar vermelha quando houver erro e verde quando estiver tudo certo. Use o evento input (ou oninput).
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validacao De Senha</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
<h1>Validação de senha</h1>
<label for="senha">Senha</label>
<input type="password" id="senha" autocomplete="new-password" aria-describedby="mensagem">
<p id="mensagem" class="erro" role="status">Use pelo menos 8 caracteres e 1 número.</p>
<script src="script.js"></script>
</body>
</html>
