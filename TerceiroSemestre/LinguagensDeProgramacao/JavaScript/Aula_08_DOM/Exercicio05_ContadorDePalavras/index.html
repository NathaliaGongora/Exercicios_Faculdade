<!DOCTYPE html>
<!--
Exercício 05 — Contador De Palavras
Origem: Lista do professor
Crie uma página HTML que conte o número de palavras em uma frase ou parágrafo inserido pelo usuário. Exiba o resultado na página.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contador De Palavras</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<h1>Contador de palavras</h1>
<label for="frase">Frase ou parágrafo</label>
<textarea id="frase" rows="5" cols="45">
</textarea>
<button id="contar">Contar palavras</button>
<p id="resultado" role="status">
</p>
<script src="script.js">
</script>
</body>
</html>
