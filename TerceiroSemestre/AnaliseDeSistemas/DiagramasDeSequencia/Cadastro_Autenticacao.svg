<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="2750" viewBox="0 0 1420 2750" role="img" aria-label="Cadastro e autenticação — Login com 2FA opcional">
<title>Cadastro e autenticação — Login com 2FA opcional</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#26354a"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#17263c;font-size:16px}.life{stroke:#8191a5;stroke-dasharray:7 6}.msg{fill:none;stroke:#26354a;stroke-width:1.6;marker-end:url(#arrow)}.ret{stroke-dasharray:7 5}.frame{fill:none;stroke:#7287a0;stroke-width:1.4}</style>
<text x="30" y="35" style="font-size:24px;font-weight:bold">Cadastro e autenticação — Login com 2FA opcional</text>
<text x="30" y="62">Tempo de cima para baixo • tracejado = retorno • retângulo estreito = execução local</text>
<rect x="20" y="85" width="220" height="58" rx="6" fill="#edf3fa" stroke="#355574"/>
<text x="130" y="108" text-anchor="middle" style="font-size:12px">actor</text><text x="130" y="132" text-anchor="middle">Cliente</text>
<line class="life" x1="130" y1="143" x2="130" y2="2685"/>
<rect x="310" y="85" width="220" height="58" rx="6" fill="#edf3fa" stroke="#355574"/>
<text x="420" y="108" text-anchor="middle" style="font-size:12px">boundary</text><text x="420" y="132" text-anchor="middle">Tela de login</text>
<line class="life" x1="420" y1="143" x2="420" y2="2685"/>
<rect x="600" y="85" width="220" height="58" rx="6" fill="#edf3fa" stroke="#355574"/>
<text x="710" y="108" text-anchor="middle" style="font-size:12px">control</text><text x="710" y="132" text-anchor="middle">Autenticação</text>
<line class="life" x1="710" y1="143" x2="710" y2="2685"/>
<rect x="890" y="85" width="220" height="58" rx="6" fill="#edf3fa" stroke="#355574"/>
<text x="1000" y="108" text-anchor="middle" style="font-size:12px">participant</text><text x="1000" y="132" text-anchor="middle">Serviço de notificação</text>
<line class="life" x1="1000" y1="143" x2="1000" y2="2685"/>
<rect x="1180" y="85" width="220" height="58" rx="6" fill="#edf3fa" stroke="#355574"/>
<text x="1290" y="108" text-anchor="middle" style="font-size:12px">database</text><text x="1290" y="132" text-anchor="middle">Banco de Dados</text>
<line class="life" x1="1290" y1="143" x2="1290" y2="2685"/>
<rect class="frame" x="25" y="570" width="1370" height="2055"/>
<rect x="25" y="570" width="1370" height="34" fill="#edf3fa"/><text x="37" y="594">alt [credenciais válidas]</text>
<line x1="25" y1="2330" x2="1395" y2="2330" stroke="#7287a0" stroke-dasharray="6 4"/><rect x="26" y="2331" width="1368" height="34" fill="#f5f7fa"/><text x="37" y="2354">else [credenciais inválidas]</text>
<rect class="frame" x="38" y="650" width="1344" height="1655"/>
<rect x="38" y="650" width="1344" height="34" fill="#edf3fa"/><text x="50" y="674">alt [2FA habilitado]</text>
<line x1="38" y1="1930" x2="1382" y2="1930" stroke="#7287a0" stroke-dasharray="6 4"/><rect x="39" y="1931" width="1342" height="34" fill="#f5f7fa"/><text x="50" y="1954">else [2FA desabilitado]</text>
<rect class="frame" x="51" y="1290" width="1318" height="615"/>
<rect x="51" y="1290" width="1318" height="34" fill="#edf3fa"/><text x="63" y="1314">alt [código válido]</text>
<line x1="51" y1="1610" x2="1369" y2="1610" stroke="#7287a0" stroke-dasharray="6 4"/><rect x="52" y="1611" width="1316" height="34" fill="#f5f7fa"/><text x="63" y="1634">else [código inválido ou expirado]</text>
<line class="msg" x1="130" y1="228" x2="420" y2="228"/>
<text x="275.0" y="216" text-anchor="middle">1. Informar e-mail e senha</text>
<line class="msg" x1="420" y1="308" x2="710" y2="308"/>
<text x="565.0" y="296" text-anchor="middle">2. Solicitar autenticação</text>
<line class="msg" x1="710" y1="388" x2="1290" y2="388"/>
<text x="1000.0" y="376" text-anchor="middle">3. Consultar credenciais e preferência 2FA</text>
<line class="msg ret" x1="1290" y1="468" x2="710" y2="468"/>
<text x="1000.0" y="456" text-anchor="middle">4. Retornar hash e configuração</text>
<rect x="705" y="510" width="10" height="56" fill="#e1ebf5" stroke="#355574"/>
<path class="msg" d="M715,530 h48 v25 h-48"/>
<text x="780" y="530" text-anchor="start">5. Verificar senha contra o hash</text>
<line class="msg" x1="710" y1="788" x2="1000" y2="788"/>
<text x="855.0" y="776" text-anchor="middle">6. Enviar código de uso único</text>
<line class="msg" x1="1000" y1="868" x2="130" y2="868"/>
<text x="565.0" y="856" text-anchor="middle">7. Entregar código</text>
<line class="msg ret" x1="710" y1="948" x2="420" y2="948"/>
<text x="565.0" y="936" text-anchor="middle">8. Solicitar código</text>
<line class="msg ret" x1="420" y1="1028" x2="130" y2="1028"/>
<text x="275.0" y="1016" text-anchor="middle">9. Exibir campo de verificação</text>
<line class="msg" x1="130" y1="1108" x2="420" y2="1108"/>
<text x="275.0" y="1096" text-anchor="middle">10. Informar código recebido</text>
<line class="msg" x1="420" y1="1188" x2="710" y2="1188"/>
<text x="565.0" y="1176" text-anchor="middle">11. Enviar código</text>
<rect x="705" y="1230" width="10" height="56" fill="#e1ebf5" stroke="#355574"/>
<path class="msg" d="M715,1250 h48 v25 h-48"/>
<text x="780" y="1250" text-anchor="start">12. Validar código e validade</text>
<rect x="705" y="1390" width="10" height="56" fill="#e1ebf5" stroke="#355574"/>
<path class="msg" d="M715,1410 h48 v25 h-48"/>
<text x="780" y="1410" text-anchor="start">13. Criar sessão</text>
<line class="msg ret" x1="710" y1="1508" x2="420" y2="1508"/>
<text x="565.0" y="1496" text-anchor="middle">14. Retornar sessão autenticada</text>
<line class="msg ret" x1="420" y1="1588" x2="130" y2="1588"/>
<text x="275.0" y="1576" text-anchor="middle">15. Exibir área autenticada</text>
<line class="msg ret" x1="710" y1="1748" x2="420" y2="1748"/>
<text x="565.0" y="1736" text-anchor="middle">16. Negar acesso</text>
<line class="msg ret" x1="420" y1="1828" x2="130" y2="1828"/>
<text x="275.0" y="1816" text-anchor="middle">17. Exibir erro de verificação</text>
<rect x="705" y="2030" width="10" height="56" fill="#e1ebf5" stroke="#355574"/>
<path class="msg" d="M715,2050 h48 v25 h-48"/>
<text x="780" y="2050" text-anchor="start">18. Criar sessão</text>
<line class="msg ret" x1="710" y1="2148" x2="420" y2="2148"/>
<text x="565.0" y="2136" text-anchor="middle">19. Retornar sessão autenticada</text>
<line class="msg ret" x1="420" y1="2228" x2="130" y2="2228"/>
<text x="275.0" y="2216" text-anchor="middle">20. Exibir área autenticada</text>
<line class="msg ret" x1="710" y1="2468" x2="420" y2="2468"/>
<text x="565.0" y="2456" text-anchor="middle">21. Negar acesso</text>
<line class="msg ret" x1="420" y1="2548" x2="130" y2="2548"/>
<text x="275.0" y="2536" text-anchor="middle">22. Exibir mensagem de erro</text>
</svg>