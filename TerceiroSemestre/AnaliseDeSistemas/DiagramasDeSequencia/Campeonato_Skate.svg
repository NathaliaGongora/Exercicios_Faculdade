<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="2030" viewBox="0 0 1420 2030" role="img" aria-label="Campeonato de skate — Enviar vídeo">
<title>Campeonato de skate — Enviar vídeo</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#26354a"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#17263c;font-size:16px}.life{stroke:#8191a5;stroke-dasharray:7 6}.msg{fill:none;stroke:#26354a;stroke-width:1.6;marker-end:url(#arrow)}.ret{stroke-dasharray:7 5}.frame{fill:none;stroke:#7287a0;stroke-width:1.4}</style>
<text x="30" y="35" style="font-size:24px;font-weight:bold">Campeonato de skate — Enviar vídeo</text>
<text x="30" y="62">Tempo de cima para baixo • tracejado = retorno • retângulo estreito = execução local</text>
<rect x="20" y="85" width="220" height="58" rx="6" fill="#edf3fa" stroke="#355574"/>
<text x="130" y="108" text-anchor="middle" style="font-size:12px">actor</text><text x="130" y="132" text-anchor="middle">Skatista</text>
<line class="life" x1="130" y1="143" x2="130" y2="1965"/>
<rect x="310" y="85" width="220" height="58" rx="6" fill="#edf3fa" stroke="#355574"/>
<text x="420" y="108" text-anchor="middle" style="font-size:12px">boundary</text><text x="420" y="132" text-anchor="middle">Portal do campeonato</text>
<line class="life" x1="420" y1="143" x2="420" y2="1965"/>
<rect x="600" y="85" width="220" height="58" rx="6" fill="#edf3fa" stroke="#355574"/>
<text x="710" y="108" text-anchor="middle" style="font-size:12px">control</text><text x="710" y="132" text-anchor="middle">Sistema do campeonato</text>
<line class="life" x1="710" y1="143" x2="710" y2="1965"/>
<rect x="890" y="85" width="220" height="58" rx="6" fill="#edf3fa" stroke="#355574"/>
<text x="1000" y="108" text-anchor="middle" style="font-size:12px">participant</text><text x="1000" y="132" text-anchor="middle">Serviço de vídeos</text>
<line class="life" x1="1000" y1="143" x2="1000" y2="1965"/>
<rect x="1180" y="85" width="220" height="58" rx="6" fill="#edf3fa" stroke="#355574"/>
<text x="1290" y="108" text-anchor="middle" style="font-size:12px">database</text><text x="1290" y="132" text-anchor="middle">Banco de Dados</text>
<line class="life" x1="1290" y1="143" x2="1290" y2="1965"/>
<rect class="frame" x="25" y="490" width="1370" height="1415"/>
<rect x="25" y="490" width="1370" height="34" fill="#edf3fa"/><text x="37" y="514">alt [inscrição ativa e prazo aberto]</text>
<line x1="25" y1="1610" x2="1395" y2="1610" stroke="#7287a0" stroke-dasharray="6 4"/><rect x="26" y="1611" width="1368" height="34" fill="#f5f7fa"/><text x="37" y="1634">else [inscrição ou prazo inválido]</text>
<rect class="frame" x="38" y="730" width="1344" height="855"/>
<rect x="38" y="730" width="1344" height="34" fill="#edf3fa"/><text x="50" y="754">alt [vídeo válido]</text>
<line x1="38" y1="1290" x2="1382" y2="1290" stroke="#7287a0" stroke-dasharray="6 4"/><rect x="39" y="1291" width="1342" height="34" fill="#f5f7fa"/><text x="50" y="1314">else [vídeo inválido]</text>
<line class="msg" x1="130" y1="228" x2="420" y2="228"/>
<text x="275.0" y="216" text-anchor="middle">1. Selecionar campeonato e vídeo</text>
<line class="msg" x1="420" y1="308" x2="710" y2="308"/>
<text x="565.0" y="296" text-anchor="middle">2. Solicitar envio</text>
<line class="msg" x1="710" y1="388" x2="1290" y2="388"/>
<text x="1000.0" y="376" text-anchor="middle">3. Consultar inscrição e prazo</text>
<line class="msg ret" x1="1290" y1="468" x2="710" y2="468"/>
<text x="1000.0" y="456" text-anchor="middle">4. Retornar situação da inscrição</text>
<line class="msg" x1="710" y1="628" x2="1000" y2="628"/>
<text x="855.0" y="616" text-anchor="middle">5. Validar formato e duração</text>
<line class="msg ret" x1="1000" y1="708" x2="710" y2="708"/>
<text x="855.0" y="696" text-anchor="middle">6. Retornar validação</text>
<line class="msg" x1="710" y1="868" x2="1000" y2="868"/>
<text x="855.0" y="856" text-anchor="middle">7. Armazenar vídeo</text>
<line class="msg ret" x1="1000" y1="948" x2="710" y2="948"/>
<text x="855.0" y="936" text-anchor="middle">8. Retornar identificador do vídeo</text>
<line class="msg" x1="710" y1="1028" x2="1290" y2="1028"/>
<text x="1000.0" y="1016" text-anchor="middle">9. Vincular vídeo à inscrição</text>
<line class="msg ret" x1="1290" y1="1108" x2="710" y2="1108"/>
<text x="1000.0" y="1096" text-anchor="middle">10. Confirmar vínculo</text>
<line class="msg ret" x1="710" y1="1188" x2="420" y2="1188"/>
<text x="565.0" y="1176" text-anchor="middle">11. Confirmar envio</text>
<line class="msg ret" x1="420" y1="1268" x2="130" y2="1268"/>
<text x="275.0" y="1256" text-anchor="middle">12. Exibir confirmação</text>
<line class="msg ret" x1="710" y1="1428" x2="420" y2="1428"/>
<text x="565.0" y="1416" text-anchor="middle">13. Informar motivo da rejeição</text>
<line class="msg ret" x1="420" y1="1508" x2="130" y2="1508"/>
<text x="275.0" y="1496" text-anchor="middle">14. Solicitar novo vídeo</text>
<line class="msg ret" x1="710" y1="1748" x2="420" y2="1748"/>
<text x="565.0" y="1717" text-anchor="middle">15. Recusar envio e informar</text>
<text x="565.0" y="1736" text-anchor="middle">motivo</text>
<line class="msg ret" x1="420" y1="1828" x2="130" y2="1828"/>
<text x="275.0" y="1816" text-anchor="middle">16. Exibir impedimento</text>
</svg>