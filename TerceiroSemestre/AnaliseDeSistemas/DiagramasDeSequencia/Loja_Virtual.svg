<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="2270" viewBox="0 0 1420 2270" role="img" aria-label="Loja virtual — Finalizar compra">
<title>Loja virtual — Finalizar compra</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#26354a"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#17263c;font-size:16px}.life{stroke:#8191a5;stroke-dasharray:7 6}.msg{fill:none;stroke:#26354a;stroke-width:1.6;marker-end:url(#arrow)}.ret{stroke-dasharray:7 5}.frame{fill:none;stroke:#7287a0;stroke-width:1.4}</style>
<text x="30" y="35" style="font-size:24px;font-weight:bold">Loja virtual — Finalizar compra</text>
<text x="30" y="62">Tempo de cima para baixo • tracejado = retorno • retângulo estreito = execução local</text>
<rect x="20" y="85" width="220" height="58" rx="6" fill="#edf3fa" stroke="#355574"/>
<text x="130" y="108" text-anchor="middle" style="font-size:12px">actor</text><text x="130" y="132" text-anchor="middle">Cliente</text>
<line class="life" x1="130" y1="143" x2="130" y2="2205"/>
<rect x="310" y="85" width="220" height="58" rx="6" fill="#edf3fa" stroke="#355574"/>
<text x="420" y="108" text-anchor="middle" style="font-size:12px">boundary</text><text x="420" y="132" text-anchor="middle">Checkout</text>
<line class="life" x1="420" y1="143" x2="420" y2="2205"/>
<rect x="600" y="85" width="220" height="58" rx="6" fill="#edf3fa" stroke="#355574"/>
<text x="710" y="108" text-anchor="middle" style="font-size:12px">control</text><text x="710" y="132" text-anchor="middle">Sistema da loja</text>
<line class="life" x1="710" y1="143" x2="710" y2="2205"/>
<rect x="890" y="85" width="220" height="58" rx="6" fill="#edf3fa" stroke="#355574"/>
<text x="1000" y="108" text-anchor="middle" style="font-size:12px">participant</text><text x="1000" y="132" text-anchor="middle">Serviço de pagamento</text>
<line class="life" x1="1000" y1="143" x2="1000" y2="2205"/>
<rect x="1180" y="85" width="220" height="58" rx="6" fill="#edf3fa" stroke="#355574"/>
<text x="1290" y="108" text-anchor="middle" style="font-size:12px">database</text><text x="1290" y="132" text-anchor="middle">Banco de Dados</text>
<line class="life" x1="1290" y1="143" x2="1290" y2="2205"/>
<rect class="frame" x="25" y="490" width="1370" height="1655"/>
<rect x="25" y="490" width="1370" height="34" fill="#edf3fa"/><text x="37" y="514">alt [reserva concluída]</text>
<line x1="25" y1="1850" x2="1395" y2="1850" stroke="#7287a0" stroke-dasharray="6 4"/><rect x="26" y="1851" width="1368" height="34" fill="#f5f7fa"/><text x="37" y="1874">else [estoque insuficiente]</text>
<rect class="frame" x="38" y="970" width="1344" height="855"/>
<rect x="38" y="970" width="1344" height="34" fill="#edf3fa"/><text x="50" y="994">alt [pagamento aprovado]</text>
<line x1="38" y1="1370" x2="1382" y2="1370" stroke="#7287a0" stroke-dasharray="6 4"/><rect x="39" y="1371" width="1342" height="34" fill="#f5f7fa"/><text x="50" y="1394">else [pagamento recusado]</text>
<line class="msg" x1="130" y1="228" x2="420" y2="228"/>
<text x="275.0" y="216" text-anchor="middle">1. Confirmar carrinho e entrega</text>
<line class="msg" x1="420" y1="308" x2="710" y2="308"/>
<text x="565.0" y="296" text-anchor="middle">2. Solicitar finalização</text>
<line class="msg" x1="710" y1="388" x2="1290" y2="388"/>
<text x="1000.0" y="357" text-anchor="middle">3. Validar e reservar estoque</text>
<text x="1000.0" y="376" text-anchor="middle">[operação transacional]</text>
<line class="msg ret" x1="1290" y1="468" x2="710" y2="468"/>
<text x="1000.0" y="456" text-anchor="middle">4. Retornar resultado da reserva</text>
<rect x="705" y="590" width="10" height="56" fill="#e1ebf5" stroke="#355574"/>
<path class="msg" d="M715,610 h48 v25 h-48"/>
<text x="780" y="610" text-anchor="start">5. Calcular total e frete</text>
<line class="msg" x1="710" y1="708" x2="1290" y2="708"/>
<text x="1000.0" y="696" text-anchor="middle">6. Criar pedido pendente</text>
<line class="msg ret" x1="1290" y1="788" x2="710" y2="788"/>
<text x="1000.0" y="776" text-anchor="middle">7. Retornar identificação do pedido</text>
<line class="msg" x1="710" y1="868" x2="1000" y2="868"/>
<text x="855.0" y="837" text-anchor="middle">8. Solicitar pagamento com chave</text>
<text x="855.0" y="856" text-anchor="middle">idempotente</text>
<line class="msg ret" x1="1000" y1="948" x2="710" y2="948"/>
<text x="855.0" y="936" text-anchor="middle">9. Retornar resultado do pagamento</text>
<line class="msg" x1="710" y1="1108" x2="1290" y2="1108"/>
<text x="1000.0" y="1096" text-anchor="middle">10. Confirmar pedido e consumir reserva</text>
<line class="msg ret" x1="1290" y1="1188" x2="710" y2="1188"/>
<text x="1000.0" y="1176" text-anchor="middle">11. Confirmar atualização</text>
<line class="msg ret" x1="710" y1="1268" x2="420" y2="1268"/>
<text x="565.0" y="1256" text-anchor="middle">12. Retornar confirmação da compra</text>
<line class="msg ret" x1="420" y1="1348" x2="130" y2="1348"/>
<text x="275.0" y="1336" text-anchor="middle">13. Exibir número do pedido</text>
<line class="msg" x1="710" y1="1508" x2="1290" y2="1508"/>
<text x="1000.0" y="1496" text-anchor="middle">14. Registrar recusa e liberar reserva</text>
<line class="msg ret" x1="1290" y1="1588" x2="710" y2="1588"/>
<text x="1000.0" y="1576" text-anchor="middle">15. Confirmar atualização</text>
<line class="msg ret" x1="710" y1="1668" x2="420" y2="1668"/>
<text x="565.0" y="1656" text-anchor="middle">16. Informar recusa do pagamento</text>
<line class="msg ret" x1="420" y1="1748" x2="130" y2="1748"/>
<text x="275.0" y="1717" text-anchor="middle">17. Exibir orientação para nova</text>
<text x="275.0" y="1736" text-anchor="middle">tentativa</text>
<line class="msg ret" x1="710" y1="1988" x2="420" y2="1988"/>
<text x="565.0" y="1976" text-anchor="middle">18. Informar itens indisponíveis</text>
<line class="msg ret" x1="420" y1="2068" x2="130" y2="2068"/>
<text x="275.0" y="2056" text-anchor="middle">19. Solicitar revisão do carrinho</text>
</svg>